    const SUPABASE_URL = "https://dwvzcwjfbernlcshkiwg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-LwvSOfJYCHvY4aS7u8cKA_KRnxvYD8";

    function anonymizePostalCode(text) {
      const match = String(text || "").match(/\b\d{5}\b/);
      return match ? `${match[0].slice(0, 2)}xxx` : null;
    }

    async function trackSupabaseEvent(eventName, data = {}) {
      try {
        const { error } = await supabaseClient
          .from("analytics_events")
          .insert({
            event_name: eventName,
            material_name: data.material_name || null,
            postal_area: data.postal_area || null,
            store_name: data.store_name || null,
            results_count: data.results_count ?? null,
            page_path: window.location.pathname
          });

        if (error) {
          console.error("SUPABASE TRACK ERROR:", error);
        }
      } catch (err) {
        console.error("SUPABASE FATAL ERROR:", err);
      }
    }

    function trackGaEvent(eventName, data = {}) {
      if (typeof gtag === "function") {
        gtag("event", eventName, data);
      }
    }

    function trackEvent(eventName, data = {}) {
      trackGaEvent(eventName, data);
      trackSupabaseEvent(eventName, data);
    }

  <script>
    let map;
    let geocoder;
    let placesService;
    let distanceMatrixService;
    let autocomplete;
    let selectedPlace = null;

    const allowedNames = [
      "OBI",
      "Hornbach",
      "Bauhaus",
      "toom",
      "hagebau",
      "Raab Karcher",
      "Späth",
      "Späth-Knoll",
      "BayWa",
      "Würth"
    ];

    function initMap() {
      const start = { lat: 50.1109, lng: 8.6821 };

      map = new google.maps.Map(document.getElementById("map"), {
        center: start,
        zoom: 11
      });

      geocoder = new google.maps.Geocoder();
      placesService = new google.maps.places.PlacesService(map);
      distanceMatrixService = new google.maps.DistanceMatrixService();

      const locationInput = document.getElementById("locationInput");

      autocomplete = new google.maps.places.Autocomplete(locationInput, {
        componentRestrictions: { country: ["de"] },
        fields: ["formatted_address", "geometry", "name"],
        types: ["address"]
      });

      autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();

        if (!place || !place.geometry || !place.geometry.location) {
          selectedPlace = null;
          return;
        }

        selectedPlace = place;

        if (place.formatted_address) {
          locationInput.value = place.formatted_address;
        }
      });

      locationInput.addEventListener("input", () => {
        selectedPlace = null;
      });

      document.getElementById("searchForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        await search();
      });
    }

    function geocodeAddress(address) {
      return new Promise((resolve, reject) => {
        geocoder.geocode(
          {
            address: address,
            componentRestrictions: { country: "DE" }
          },
          (results, status) => {
            if (status !== "OK" || !results || !results[0]) {
              reject(new Error("Adresse nicht gefunden"));
              return;
            }

            resolve(results[0]);
          }
        );
      });
    }

    function nearbySearch(request) {
      return new Promise((resolve, reject) => {
        placesService.nearbySearch(request, (results, status) => {
          if (status !== google.maps.places.PlacesServiceStatus.OK || !results) {
            reject(new Error("Keine Baumärkte gefunden"));
            return;
          }

          resolve(results);
        });
      });
    }

    function getAirDistanceKm(origin, destination) {
      const R = 6371;
      const dLat = (destination.lat() - origin.lat()) * Math.PI / 180;
      const dLng = (destination.lng() - origin.lng()) * Math.PI / 180;
      const lat1 = origin.lat() * Math.PI / 180;
      const lat2 = destination.lat() * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.sin(dLng / 2) * Math.sin(dLng / 2) *
        Math.cos(lat1) * Math.cos(lat2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    function getDistanceMatrix(origin, destinations) {
      return new Promise((resolve) => {
        distanceMatrixService.getDistanceMatrix(
          {
            origins: [origin],
            destinations: destinations,
            travelMode: google.maps.TravelMode.DRIVING,
            unitSystem: google.maps.UnitSystem.METRIC,
            drivingOptions: {
              departureTime: new Date()
            }
          },
          (response, status) => {
            if (
              status !== "OK" ||
              !response ||
              !response.rows ||
              !response.rows[0] ||
              !response.rows[0].elements
            ) {
              resolve(null);
              return;
            }

            resolve(response.rows[0].elements);
          }
        );
      });
    }

    function formatKmFromMeters(meters) {
      return (meters / 1000).toFixed(1).replace(".", ",");
    }

    function getPriceFromCard(card) {
      const priceEl = card.querySelector(".price-box");

      if (!priceEl) return 999999;

      const text = priceEl.textContent || "";
      const match = text.match(/(\d+[.,]\d+)/);

      if (!match) return 999999;

      return parseFloat(match[1].replace(",", "."));
    }

    function getStoreLogoByName(storeName) {
      const name = (storeName || "").toLowerCase();

      if (name.includes("obi")) return "imagesobi.jpg";
      if (name.includes("hornbach")) return "imageshornbach.png";
      if (name.includes("bauhaus")) return "bauhaus.png";
      if (name.includes("toom")) return "toom.webp";
      if (name.includes("hagebau")) return "hagebau.jpg";
      if (name.includes("baywa")) return "baywa.png";
      if (name.includes("würth") || name.includes("wuerth")) return "würth.png";
      if (name.includes("raab")) return "raabkarcher.png";
      if (name.includes("späth") || name.includes("spaeth")) return "späthknoll.jpg";

      return null;
    }

    function createStoreLogoHtml(storeName) {
      const logoPath = getStoreLogoByName(storeName);

      if (logoPath) {
        return `
          <img
            class="store-logo"
            src="${logoPath}"
            alt="${escapeHtml(storeName)} Logo"
            onerror="this.outerHTML='<div class=&quot;store-logo-fallback&quot;>🏬</div>'"
          />
        `;
      }

      return `<div class="store-logo-fallback">🏬</div>`;
    }
const STORE_SEARCH_URLS = {
  obi: query =>
    `https://www.obi.de/search/${encodeURIComponent(query)}/`,

  bauhaus: query =>
    `https://www.bauhaus.info/suche/produkte?text=${encodeURIComponent(query)}`,

  hornbach: query =>
    `https://www.hornbach.de/s/${encodeURIComponent(query)}`,

  toom: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `site:toom.de/produkte ${query}`
    )}`,

  hagebau: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `site:hagebau.de ${query}`
    )}`,

  baywa: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `site:baywa-baustoffe.de ${query}`
    )}`,

  wuerth: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `site:wuerth.de ${query}`
    )}`,

  raabkarcher: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `site:raabkarcher.de ${query}`
    )}`,

  spaeth: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `Späth Baustoffe ${query}`
    )}`,

  spaethknoll: query =>
    `https://www.google.com/search?q=${encodeURIComponent(
      `Späth-Knoll ${query}`
    )}`
};


function getStoreIdFromName(storeName) {
  const name = String(storeName || "").toLowerCase();

  if (name.includes("obi")) return "obi";
  if (name.includes("hornbach")) return "hornbach";
  if (name.includes("bauhaus")) return "bauhaus";
  if (name.includes("toom")) return "toom";
  if (name.includes("hagebau")) return "hagebau";
  if (name.includes("baywa")) return "baywa";
  if (name.includes("würth") || name.includes("wuerth")) return "wuerth";

  return null;
}

function createStoreSearchUrl(storeName, productInput) {
  const storeId = getStoreIdFromName(storeName);
  const query = productInput || "";

  if (storeId && STORE_SEARCH_URLS[storeId]) {
    return STORE_SEARCH_URLS[storeId](query);
  }

  return `https://www.google.com/search?q=${encodeURIComponent(`${storeName} ${query}`)}`;
}
 function createRouteUrl(originAddress, destinationAddress) {
  return (
    "https://www.google.com/maps/dir/?api=1" +
    `&origin=${encodeURIComponent(originAddress || "")}` +
    `&destination=${encodeURIComponent(destinationAddress || "")}` +
    "&travelmode=driving"
  );
}

function toggleStoreActionPanel(card, place, product, location, kmText, minuteText) {
  const existingPanel = card.querySelector(".store-action-panel");

  if (existingPanel) {
    existingPanel.remove();
    return;
  }

  document.querySelectorAll(".store-action-panel").forEach(panel => {
    panel.remove();
  });

  const panel = document.createElement("div");
  panel.className = "store-action-panel";

  const storeUrl = createStoreSearchUrl(
    place.name || "",
    product || ""
  );

  const routeUrl = createRouteUrl(
    location,
    place.vicinity || place.name || ""
  );

  panel.innerHTML = `
    <div class="store-action-title">
      ${escapeHtml(place.name || "Baumarkt")}
    </div>

    <div class="store-action-text">
      Produkt: ${escapeHtml(product || "nicht angegeben")}<br>
      Adresse: ${escapeHtml(place.vicinity || "Adresse nicht verfügbar")}<br>
      Entfernung: ${escapeHtml(kmText)} · Fahrzeit: ${escapeHtml(minuteText)}
    </div>

    <div class="store-action-buttons">
      <button class="store-button" type="button">
        Im Store schauen
      </button>

      <button class="route-button" type="button">
        Route öffnen
      </button>
    </div>
  `;

  panel.querySelector(".store-button").addEventListener("click", (event) => {
    event.stopPropagation();

    window.open(storeUrl, "_blank", "noopener,noreferrer");
  });

  panel.querySelector(".route-button").addEventListener("click", (event) => {
    event.stopPropagation();

    window.open(routeUrl, "_blank", "noopener,noreferrer");
  });

  card.querySelector(".result-left").appendChild(panel);
}
   
    async function search() {
      const location = document.getElementById("locationInput").value.trim();
      const product = document.getElementById("productInput").value.trim();
      const resultsEl = document.getElementById("results");
      const statusEl = document.getElementById("status");
      const searchButton = document.getElementById("searchButton");
      const sortPriceButton = document.getElementById("sortPriceButton");

      if (!location) {
        alert("Bitte eine Adresse eingeben");
        return;
      }

      trackEvent("search_started", {
        material_name: product || null,
        postal_area: anonymizePostalCode(location)
      });

      statusEl.innerText = "Suche Baumärkte in Ihrer Nähe...";
      resultsEl.innerHTML = "";
      sortPriceButton.style.display = "none";
      searchButton.disabled = true;

      try {
        let origin;

        if (
          selectedPlace &&
          selectedPlace.geometry &&
          selectedPlace.geometry.location &&
          selectedPlace.formatted_address === location
        ) {
          origin = selectedPlace.geometry.location;
        } else {
          const geocodeResult = await geocodeAddress(location);
          origin = geocodeResult.geometry.location;
        }

        const request = {
          location: origin,
          rankBy: google.maps.places.RankBy.DISTANCE,
          keyword: "Baumarkt"
        };

        const rawPlaces = await nearbySearch(request);

        const filteredPlaces = rawPlaces
          .filter(place => place.geometry && place.geometry.location)
          .filter(place => {
            const name = (place.name || "").toLowerCase();
            return allowedNames.some(allowed => name.includes(allowed.toLowerCase()));
          })
          .map(place => ({
            ...place,
            airDistanceKm: getAirDistanceKm(origin, place.geometry.location)
          }))
          .sort((a, b) => a.airDistanceKm - b.airDistanceKm)
          .slice(0, 10);

        if (filteredPlaces.length === 0) {
          trackEvent("search_no_results", {
            material_name: product || null,
            postal_area: anonymizePostalCode(location)
          });

          statusEl.innerText = "Keine passenden Baumärkte gefunden";
          sortPriceButton.style.display = "none";
          searchButton.disabled = false;
          return;
        }

        const destinations = filteredPlaces.map(place => place.geometry.location);
        const matrixElements = await getDistanceMatrix(origin, destinations);

        const enrichedPlaces = filteredPlaces
          .map((place, index) => {
            const fallbackDistanceMeters = Math.round(place.airDistanceKm * 1000);

            if (!matrixElements) {
              return {
                ...place,
                distanceText: `${place.airDistanceKm.toFixed(1).replace(".", ",")} km`,
                distanceMeters: fallbackDistanceMeters,
                durationText: "nicht verfügbar",
                durationMinutes: null
              };
            }

            const routeInfo = matrixElements[index];

            if (!routeInfo || routeInfo.status !== "OK") {
              return {
                ...place,
                distanceText: `${place.airDistanceKm.toFixed(1).replace(".", ",")} km`,
                distanceMeters: fallbackDistanceMeters,
                durationText: "nicht verfügbar",
                durationMinutes: null
              };
            }

            const distanceMeters = routeInfo.distance?.value ?? fallbackDistanceMeters;
            const durationSeconds = routeInfo.duration?.value ?? null;

            return {
              ...place,
              distanceText: routeInfo.distance?.text || `${place.airDistanceKm.toFixed(1).replace(".", ",")} km`,
              distanceMeters,
              durationText: routeInfo.duration?.text || "nicht verfügbar",
              durationMinutes: durationSeconds ? Math.round(durationSeconds / 60) : null
            };
          })
          .sort((a, b) => a.distanceMeters - b.distanceMeters);

        resultsEl.innerHTML = "";

        enrichedPlaces.forEach((place) => {
          const kmText = place.distanceMeters
            ? `${formatKmFromMeters(place.distanceMeters)} km`
            : place.distanceText;

          const minuteText = place.durationMinutes
            ? `${place.durationMinutes} min`
            : place.durationText;

          const div = document.createElement("div");
          div.className = "result-card";

          div.innerHTML = `
            <div class="result-content">
              <div class="result-left">
                <div class="result-name">${escapeHtml(place.name || "Unbekannter Baumarkt")}</div>
                <div class="result-address">${escapeHtml(place.vicinity || "Adresse nicht verfügbar")}</div>
                <div class="result-product">Produkt: ${escapeHtml(product || "nicht angegeben")}</div>
                <div class="result-meta">
                  <span class="distance-km">Entfernung: ${escapeHtml(kmText)}</span>
                  <span class="time-min">Fahrzeit: ${escapeHtml(minuteText)}</span>
                </div>
              </div>
            </div>

            <div class="result-logo-slot">
              ${createStoreLogoHtml(place.name || "Baumarkt")}
            </div>
          `;

div.addEventListener("click", () => {
  trackEvent("store_card_opened", {
    material_name: product || null,
    store_name: place.name || null,
    postal_area: anonymizePostalCode(location)
  });

  toggleStoreActionPanel(div, place, product, location, kmText, minuteText);
});

resultsEl.appendChild(div);
});

        trackEvent("search_results", {
          material_name: product || null,
          postal_area: anonymizePostalCode(location),
          results_count: enrichedPlaces.length
        });

        if (matrixElements) {
          statusEl.innerText = `${enrichedPlaces.length} nächstgelegene Baumärkte gefunden`;
        } else {
          statusEl.innerText = `${enrichedPlaces.length} nächstgelegene Baumärkte gefunden – Fahrzeit derzeit nicht verfügbar`;
        }

        sortPriceButton.style.display = "block";
      } catch (error) {
        console.error(error);

        trackEvent("search_error", {
          material_name: product || null,
          postal_area: anonymizePostalCode(location)
        });

        statusEl.innerText = error.message || "Fehler bei der Suche";
      } finally {
        searchButton.disabled = false;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.initMap = initMap;

    document.getElementById("sortPriceButton").addEventListener("click", () => {
      const container = document.getElementById("results");
      const cards = Array.from(container.querySelectorAll(".result-card"));

      cards.sort((a, b) => {
        return getPriceFromCard(a) - getPriceFromCard(b);
      });

      container.innerHTML = "";
      cards.forEach(card => container.appendChild(card));

      trackEvent("sort_by_price_clicked", {});
    });
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA7RCu62ICAEdQkKOPdmueVaqpW6BFhM-M&libraries=places&callback=initMap"
    async
    defer>
  </script>

  <script src="materials-database.js"></script>
  <script src="generate-prices.js"></script>
  <script src="product-compare.js"></script>
</body>
</html>
